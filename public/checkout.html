<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pagamento — Loja de Beleza</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;padding:40px;background:#f8f8f8}
      .card{max-width:720px;margin:40px auto;padding:24px;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
      h1{margin-top:0}
      .actions{margin-top:20px}
      .btn{display:inline-block;padding:10px 16px;background:#ff5a7a;color:#fff;border-radius:6px;text-decoration:none}
      .secondary{background:#777}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Página de Pagamento</h1>
      <p>Aqui você pode integrar seu provedor de pagamento (Stripe, PagSeguro, Mercado Pago etc.).</p>
      <p>Este é um exemplo estático. Substitua por sua integração de checkout real.</p>
      <div class="actions">
        <a class="btn" href="#">Pagar — (simular)</a>
        <a class="btn secondary" href="/" style="margin-left:12px">Voltar à loja</a>
      </div>
    </div>
  </body>
</html>
